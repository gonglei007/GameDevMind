name: Format Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-format:
    name: Check Markdown Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install check dependencies
        run: pip install -r tools/check/requirements.txt
      - name: Run checker regression tests
        run: python -m unittest discover -s tools/check -p 'test_*.py' -v
      - name: Run document quality check
        run: python tools/check/check_docs.py
      - name: Audit image references
        run: python tools/check/check_images.py

  case-regression:
    name: Check Guild Ownership Case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build lifecycle regression with sanitizers
        run: >-
          c++ -std=c++17 -Wall -Wextra -Werror
          -fsanitize=address,undefined -fno-omit-frame-pointer -g
          'code/gamedevmind/1.基础能力/1.1.2.C++语言/smart_pointer/guild_cycle_regression.cpp'
          -o /tmp/guild-cycle-regression
      - name: Verify leave, disconnect and weak ownership
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: /tmp/guild-cycle-regression

  network-sync-regression:
    name: Check Network Synchronization Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure networking examples with sanitizers
        run: >-
          cmake -S 'code/gamedevmind/2.技术能力/2.2.1.网络与通信/network_sync'
          -B /tmp/network-sync-build -DCMAKE_BUILD_TYPE=Debug
          '-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Build networking examples
        run: cmake --build /tmp/network-sync-build
      - name: Verify lockstep consistency and prediction reconciliation
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir /tmp/network-sync-build --output-on-failure

  client-render-audit:
    name: Check Client Render Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify material identity and conservative sharing candidates
        run: >-
          dotnet run --configuration Release --project
          'code/gamedevmind/3.研发能力/3.1.3.客户端优化/render_audit/RenderAudit.Regression.csproj'

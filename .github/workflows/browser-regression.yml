name: Browser Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-browser:
    name: Check Navigation Browser Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/check/browser
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/check/browser/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:local
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: navigation-browser-report
          path: output/playwright-regression/
          retention-days: 7
          if-no-files-found: warn

  github-readme:
    name: Check GitHub README Browser Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/check/browser
    env:
      README_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/check/browser/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:readme
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: github-readme-browser-report
          path: output/playwright-regression/
          retention-days: 7
          if-no-files-found: warn

name: Check Generated Content

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-index:
    name: Check Navigation Indexes and Statistics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify deterministic generated content
        run: python tools/check/generate_catalog.py --check
